name: Build and Release EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller autopep8
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Auto-fix Python Indentation
      run: |
        autopep8 --in-place --aggressive --aggressive main.py

    - name: Build Single EXE
      run: |
        pyinstaller --onefile --noconsole --name "yt-tv-in-windows" main.py

    - name: Build Directory
      run: |
        pyinstaller --noconsole --name "yt-tv-in-windows-folder" --distpath ./dist-folder main.py

    - name: Create ZIP
      run: |
        if (!(Test-Path dist)) { New-Item -ItemType Directory -Path dist }
        Compress-Archive -Path ./dist-folder/yt-tv-in-windows-folder/* -DestinationPath ./dist/yt-tv-in-windows.zip

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "1.0.0"  # Đã đổi thành tag cố định theo ý bạn
        name: "Release 1.0.0 (Build ${{ github.run_number }})" # Tên release vẫn có số build để dễ phân biệt
        draft: false
        prerelease: false
        make_latest: true # Luôn đánh dấu đây là bản mới nhất
        files: |
          dist/yt-tv-in-windows.exe
          dist/yt-tv-in-windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

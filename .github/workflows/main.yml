name: Build 4 Versions (PyInstaller & Nuitka)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        architecture: 'x64'

    - name: Install Build Tools and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller nuitka ordered-set autopep8 PyQt5 PyQtWebEngine

    - name: Auto-fix Python Indentation
      run: |
        autopep8 --in-place --aggressive --aggressive main.py

    - name: Create output directory
      run: |
        if (!(Test-Path dist)) { New-Item -ItemType Directory -Path dist }

    # ==========================================
    # 1. PYINSTALLER - BẢN NHIỀU FILE (ZIP)
    # ==========================================
    - name: Build [PyInstaller - ZIP]
      run: |
        pyinstaller --noconsole --name "pyinstaller-app" --distpath ./build_pyinst_dir --collect-all PyQt5 --collect-all PyQtWebEngine main.py
        Compress-Archive -Path ./build_pyinst_dir/pyinstaller-app/* -DestinationPath ./dist/pyinstaller-yt-tv.zip

    # ==========================================
    # 2. PYINSTALLER - BẢN 1 FILE (EXE)
    # ==========================================
    - name: Build [PyInstaller - EXE]
      run: |
        pyinstaller --onefile --noconsole --name "pyinstaller-yt-tv" --distpath ./build_pyinst_one --collect-all PyQt5 --collect-all PyQtWebEngine main.py
        Move-Item -Path ./build_pyinst_one/pyinstaller-yt-tv.exe -Destination ./dist/pyinstaller-yt-tv.exe

    # ==========================================
    # 3. NUITKA - BẢN NHIỀU FILE (ZIP)
    # ==========================================
    - name: Build [Nuitka - ZIP]
      run: |
        # Thêm --assume-yes-for-downloads và sửa thành --windows-console-mode=disable
        nuitka --standalone --enable-plugin=pyqt5 --windows-console-mode=disable --assume-yes-for-downloads --output-dir=build_nuitka_dir main.py
        Compress-Archive -Path ./build_nuitka_dir/main.dist/* -DestinationPath ./dist/nuitka-yt-tv.zip

    # ==========================================
    # 4. NUITKA - BẢN 1 FILE (EXE)
    # ==========================================
    - name: Build [Nuitka - EXE]
      run: |
        # Thêm --assume-yes-for-downloads và sửa thành --windows-console-mode=disable
        nuitka --onefile --enable-plugin=pyqt5 --windows-console-mode=disable --assume-yes-for-downloads --output-dir=build_nuitka_one main.py
        Move-Item -Path ./build_nuitka_one/main.exe -Destination ./dist/nuitka-yt-tv.exe

    # ==========================================
    # TẠO RELEASE VÀ UPLOAD 4 FILE
    # ==========================================
    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "1.0.3"
        name: "Release v1.0.3"
        draft: false
        prerelease: false
        make_latest: true
        files: |
          dist/pyinstaller-yt-tv.zip
          dist/pyinstaller-yt-tv.exe
          dist/nuitka-yt-tv.zip
          dist/nuitka-yt-tv.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

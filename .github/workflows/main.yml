name: Build and Release EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install build tools
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller autopep8
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Auto-fix Python Indentation (Sửa lỗi căn lề tự động)
      run: |
        # Công cụ này sẽ tự động lùi dòng đúng 4 space và sửa lỗi cú pháp cơ bản
        autopep8 --in-place --aggressive --aggressive main.py

    - name: Build Single EXE (Bản 1 file)
      run: |
        pyinstaller --onefile --noconsole --name "yt-tv-in-windows" main.py

    - name: Build Directory (Bản nhiều file)
      run: |
        pyinstaller --noconsole --name "yt-tv-in-windows-folder" --distpath ./dist-folder main.py

    - name: Create ZIP for Multi-file version
      run: |
        # Tạo thư mục dist nếu chưa có để tránh lỗi khi nén
        if (!(Test-Path dist)) { New-Item -ItemType Directory -Path dist }
        Compress-Archive -Path ./dist-folder/yt-tv-in-windows-folder/* -DestinationPath ./dist/yt-tv-in-windows.zip

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        # Sử dụng số lần chạy để tránh lỗi trùng lặp Tag nếu để v1.0.0 cố định
        tag_name: "v1.0.0"
        name: Release v${{ github.run_number }}
        draft: false
        prerelease: false
        files: |
          dist/yt-tv-in-windows.exe
          dist/yt-tv-in-windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

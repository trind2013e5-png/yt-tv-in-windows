name: Build and Release EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Build Single EXE (Bản 1 file)
      run: |
        # Build ra file đơn lẻ và đổi tên thành yt-tv-in-windows.exe
        pyinstaller --onefile --noconsole --name "yt-tv-in-windows" main.py

    - name: Build Directory (Bản nhiều file)
      run: |
        # Build ra thư mục (mặc định) để nén thành zip
        # Dùng --distpath để không đè lên bản build trước
        pyinstaller --noconsole --name "yt-tv-in-windows-folder" --distpath ./dist-folder main.py

    - name: Create ZIP for Multi-file version
      run: |
        # Nén thư mục build thành file .zip
        Compress-Archive -Path ./dist-folder/yt-tv-in-windows-folder/* -DestinationPath ./dist/yt-tv-in-windows.zip

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        tag_name: "v1.0.0"
        name: Release v${{ github.run_number }}
        draft: false
        prerelease: false
        files: |
          dist/yt-tv-in-windows.exe
          dist/yt-tv-in-windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
